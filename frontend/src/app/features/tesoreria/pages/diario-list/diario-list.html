<div class="contenedor-diario">

  <h2>📒 Diario Contable</h2>

  <div class="barra-superior">

    <div>
      <label>Ejercicio</label>

      <input
        type="number"
        [(ngModel)]="ejercicio"
        (change)="cargarDiario()">
    </div>

  </div>

  <div
    *ngIf="cargando"
    class="mensaje">

    Cargando diario contable...

  </div>

  <div
    *ngIf="error"
    class="error">

    {{ error }}

  </div>

  <table
    *ngIf="!cargando && diarios.length > 0"
    class="tabla">

    <thead>
    <tr>
      <th>Nº</th>
      <th>Fecha</th>
      <th>Concepto</th>
      <th>Origen</th>
      <th>Estado</th>
    </tr>
    </thead>

    <tbody>
    <tr *ngFor="let d of diarios">
      <td>{{ d.numeroAsiento }}</td>
      <td>{{ d.fecha }}</td>
      <td>{{ d.concepto }}</td>
      <td>{{ d.origen }}</td>
      <td>{{ d.estado }}</td>
    </tr>
    </tbody>

  </table>

  <div
    *ngIf="!cargando && diarios.length === 0"
    class="sin-datos">

    No hay asientos para la comunidad seleccionada.

  </div>

</div>
