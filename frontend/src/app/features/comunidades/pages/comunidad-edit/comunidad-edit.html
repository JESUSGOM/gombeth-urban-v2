<div class="edit-page">
  <div class="page-header">
    <div>
      <h2>Editar Comunidad</h2>
      <p>Datos generales de la comunidad</p>
    </div>
  </div>
  @if (comunidad) {
    <div class="form-card">
      <div class="form-grid">
        <div class="form-group">
          <label>ID</label>
          <input type="text" [value]="comunidad.id" readonly>
        </div>
        <div class="form-group full">
          <label>Nombre</label>
          <input type="text" [(ngModel)]="comunidad.nombre">
        </div>

        <div class="form-group">
          <label>CIF/NIF</label>
          <input type="text" [(ngModel)]="comunidad.nifCif">
        </div>

        <div class="form-group">
          <label>Identificador SEPA</label>
          <input type="text" [(ngModel)]="comunidad.identificadorAcreedor">
        </div>

        <div class="form-group full">
          <label>Dirección</label>
          <input type="text" [(ngModel)]="comunidad.direccion">
        </div>

        <div class="form-group">
          <label>Código Postal</label>
          <input type="text" [(ngModel)]="comunidad.codigoPostal">
        </div>

        <div class="form-group">
          <label>Población</label>
          <input type="text" [(ngModel)]="comunidad.poblacion">
        </div>

        <div class="form-group">
          <label>Provincia</label>
          <input type="text" [(ngModel)]="comunidad.provincia">
        </div>

        <div class="form-group">
          <label>País</label>
          <input type="text" [(ngModel)]="comunidad.paiscod">
        </div>

        <div class="form-group full">
          <label>IBAN</label>
          <input type="text" [(ngModel)]="comunidad.iban">
        </div>

        <div class="form-group">
          <label>BIC</label>
          <input type="text" [(ngModel)]="comunidad.bic">
        </div>

        <div class="form-group">
          <label>Sufijo</label>
          <input type="text" [(ngModel)]="comunidad.sufijo">
        </div>
      </div>
      @if (mensaje) {
        <div class="success-card">
          {{ mensaje }}
        </div>
      }

      @if (error) {
        <div class="error-card">
          {{ error }}
        </div>
      }
      <div class="form-actions">
        <button class="secondary-button" (click)="volver()">
          Volver
        </button>
        <button
          class="primary-button"
          (click)="guardar()"
          [disabled]="guardando">
          {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
        </button>
      </div>
    </div>
  } @else {
    <div class="info-card">
      Cargando comunidad...
    </div>
  }
</div>
