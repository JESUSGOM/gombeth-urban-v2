spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# No mostrar detalles internos en respuestas de error.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Sesiones.
server.servlet.session.timeout=${GOMBETH_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${GOMBETH_COOKIE_SECURE:false}

# Cierre controlado.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Logging.
logging.file.path=${GOMBETH_LOG_PATH:${user.dir}/logs}
logging.level.root=INFO
logging.level.com.gombeth.urban=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN