# ============================================================
# Gombeth Urban
# Configuracion local de ejemplo
# ============================================================
#
# Copiar este archivo como:
#
# application-local.properties
#
# No guardar usuarios, contraseñas ni direcciones reales
# de bases de datos en Git.
#
# Las propiedades pueden establecerse mediante estas
# variables de entorno:
#
# GOMBETH_DB_URL
# GOMBETH_DB_USERNAME
# GOMBETH_DB_PASSWORD
#

spring.datasource.url=${GOMBETH_DB_URL:jdbc:mysql://localhost:3306/gombeth_urban}
spring.datasource.username=${GOMBETH_DB_USERNAME:usuario_local}
spring.datasource.password=${GOMBETH_DB_PASSWORD:CAMBIAR_CONTRASENA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver