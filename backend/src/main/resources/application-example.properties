# ============================================================
# Gombeth Urban
# Configuración privada de ejemplo
# ============================================================
#
# Copiar este archivo fuera de los recursos compilados:
#
# backend/config/application-local.properties
#
# No guardar usuarios, contraseñas, hosts ni credenciales
# reales en Git.
#
# Para arrancar la aplicación con la base remota compartida:
#
# --spring.profiles.active=prod,local
#
# También pueden utilizarse variables de entorno:
#
# GOMBETH_DB_URL
# GOMBETH_DB_USERNAME
# GOMBETH_DB_PASSWORD
# GOMBETH_PRODUCTION_CONFIRMED
#

spring.datasource.url=${GOMBETH_DB_URL:}
spring.datasource.username=${GOMBETH_DB_USERNAME:}
spring.datasource.password=${GOMBETH_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Debe ser true únicamente cuando se pretende utilizar
# conscientemente la base compartida.
gombeth.production.confirmed=${GOMBETH_PRODUCTION_CONFIRMED:false}