spring.application.name=urban-backend

server.port=8080

# El perfil debe indicarse expresamente al arrancar.
# No se activa automáticamente ninguna conexión real.

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=30000

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.cors.allowed-origins=${GOMBETH_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.incidencias.public-url=${GOMBETH_INCIDENCIAS_PUBLIC_URL:https://jfgb.es/incidenciacomunidad/}
app.storage.base-path=${GOMBETH_STORAGE_BASE_PATH:${user.dir}/../ficheros}

# Protección de la base remota compartida.
gombeth.production.database-name=sepa_1914
gombeth.production.confirmed=${GOMBETH_PRODUCTION_CONFIRMED:false}